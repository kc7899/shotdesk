<!doctype html><html lang="zh-CN" data-title="进入片场"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>进入片场</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f6fa;color:#202634;font:16px system-ui}form{padding:32px;background:white;border:1px solid #e7e9f0;border-radius:16px;width:min(340px,80vw)}input,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-top:14px;font:inherit}button{background:#6556e8;color:white;border:0;cursor:pointer}p{font-size:14px;color:#697386}#error{color:#c03944}.ui-language{display:block;margin-left:auto;padding:6px;border:1px solid #ddd;border-radius:6px;background:white}</style><body><script src="/i18n.js?v=ui-locale-1"></script><form><h2><span data-i18n="◧ 进入片场">◧ 进入片场</span></h2><p><span data-i18n="请输入这台片场设置的访问密码。">请输入这台片场设置的访问密码。</span></p><input type="password" id="password" autocomplete="current-password" required aria-label="访问密码" data-i18n-aria-label="访问密码"><button><span data-i18n="进入工作台">进入工作台</span></button><p id="error" role="status"></p></form><script>const ui=ShotdeskI18n.text;document.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=document.querySelector('button');b.disabled=true;try{const r=await fetch('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});const x=await r.json();if(!r.ok)throw Error(x.error||ui('登录失败'));location.replace('/')}catch(e){document.querySelector('#error').textContent=e.message}finally{b.disabled=false}}</script></body></html>
